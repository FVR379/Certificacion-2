<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Viajero frecuente</title>
    <link href="/static/style.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="registro">
            <h1>Registro</h1>
            {% for mensaje in get_flashed_messages() %}
                <p>{{ mensaje }}</p>
            {% endfor %}
            <form action="{{ url_for('registro') }}" method="post">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" minlength="3" autocomplete="given-name" required><br><br>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" minlength="3" autocomplete="family-name" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="email" required><br><br>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" minlength="3" autocomplete="new-password" required><br><br>
                <label for="confirm_password">Conf. Contraseña:</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="3" autocomplete="new-password" required><br><br>
                <button type="submit">Registrar</button>
            </form>
        </div>

        <div class="login">
            <h1>Inicio de Sesión</h1>
            <form action="{{ url_for('login') }}" method="post">
                <label for="login_email">Email:</label>
                <input type="email" id="login_email" name="email" autocomplete="username" required><br><br>
                <label for="login_password">Contraseña:</label>
                <input type="password" id="login_password" name="password" autocomplete="current-password" required><br><br>
                <button type="submit">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</body>

</html>
